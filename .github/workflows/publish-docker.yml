name: Publish Docker image

# A dist custom publish job (see dist-workspace.toml's `publish-jobs`) — dist
# only builds/hosts binaries, it doesn't build container images. Reuses the
# x86_64/aarch64 linux-musl binaries dist already built and attached to this
# tag's GitHub Release (ADR-0004: they're statically linked, so the image
# needs no libc and no `cargo build` step of its own).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the release's linux-musl binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/release-assets binaries/linux/amd64 binaries/linux/arm64
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'boast-x86_64-unknown-linux-musl.tar.xz' \
            --pattern 'boast-aarch64-unknown-linux-musl.tar.xz' \
            --dir /tmp/release-assets
          tar -xJf /tmp/release-assets/boast-x86_64-unknown-linux-musl.tar.xz -C /tmp/release-assets
          tar -xJf /tmp/release-assets/boast-aarch64-unknown-linux-musl.tar.xz -C /tmp/release-assets
          cp /tmp/release-assets/boast-x86_64-unknown-linux-musl/boast binaries/linux/amd64/boast
          cp /tmp/release-assets/boast-aarch64-unknown-linux-musl/boast binaries/linux/arm64/boast
          chmod +x binaries/linux/amd64/boast binaries/linux/arm64/boast

      - name: Determine the image version tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
