name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · reference drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        run: cargo install mdbook --locked

      - name: Regenerate reference pages
        run: ./docs/site/generate-reference.sh

      - name: Check reference pages match the real CLI
        run: |
          if ! git diff --exit-code -- docs/site/src/reference/providers.md docs/site/src/reference/cli.md; then
            echo "::error::docs/site/src/reference/*.md is stale — run docs/site/generate-reference.sh and commit the result."
            exit 1
          fi

      - name: Build the book
        run: mdbook build docs/site

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
