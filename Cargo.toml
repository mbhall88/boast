[package]
name = "boast"
version = "0.2.1"
edition = "2021"
rust-version = "1.97"
description = "A reproducible research-impact aggregator: gather downloads, citations, stars, and field-standing for a research tool or paper into dated, quotable snapshots."
license = "MIT"
repository = "https://github.com/mbhall88/boast"
homepage = "https://github.com/mbhall88/boast"
readme = "README.md"
keywords = ["bibliometrics", "citations", "research", "metrics", "impact"]
categories = ["command-line-utilities", "science"]

[lib]
name = "boast"
path = "src/lib.rs"

[[bin]]
name = "boast"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"
time = { version = "0.3.53", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
