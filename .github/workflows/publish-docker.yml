name: Publish Docker image

# A dist custom publish job (see dist-workspace.toml's `publish-jobs`) — dist
# only builds/hosts binaries, it doesn't build container images. Reuses the
# x86_64/aarch64 linux-musl binaries dist already built and attached to this
# tag's GitHub Release (ADR-0004: they're statically linked, so the image
# needs no libc and no `cargo build` step of its own).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the release's linux-musl binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/release-assets binaries/linux/amd64 binaries/linux/arm64
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'boast-x86_64-unknown-linux-musl.tar.xz*' \
            --pattern 'boast-aarch64-unknown-linux-musl.tar.xz*' \
            --dir /tmp/release-assets
          cd /tmp/release-assets
          # dist publishes a .sha256 alongside every archive; verify before
          # anything downloaded gets baked into a published image.
          sha256sum -c boast-x86_64-unknown-linux-musl.tar.xz.sha256
          sha256sum -c boast-aarch64-unknown-linux-musl.tar.xz.sha256
          tar -xJf boast-x86_64-unknown-linux-musl.tar.xz
          tar -xJf boast-aarch64-unknown-linux-musl.tar.xz
          cd "$GITHUB_WORKSPACE"
          cp /tmp/release-assets/boast-x86_64-unknown-linux-musl/boast binaries/linux/amd64/boast
          cp /tmp/release-assets/boast-aarch64-unknown-linux-musl/boast binaries/linux/arm64/boast
          chmod +x binaries/linux/amd64/boast binaries/linux/arm64/boast

      - name: Determine the image version tag
        id: version
        # Tags never carry a "v" prefix (release-please-config.json's
        # include-v-in-tag: false), so github.ref_name is already the bare
        # version.
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
